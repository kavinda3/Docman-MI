<div class="container-fluid margin_bottom_20">

    <!-- header bread crumbs -->
    <div class="container-fluid margin_bottom_20">
        <app-bread-crumbs></app-bread-crumbs>
    </div>
    <!-- header bread crumbs --> 
      
      <!-- Header title  -->
      <div class="container-fluid margin_bottom_30">   
          <div class="container-fluid fluid-bg-1 ishfaak-align-middle ">   
              <div class="container">  
                  <div class="row container_at_1665">
                      <div class="d-flex flex-row">
                          <div class="d-inline-block">
                              <div class="d-inline-block padding_right_30">
                                  <img src="/assets/images/admin.svg" class="side_nav_icon_extra_big fill_svg_white">
                              </div>
                          </div>
                          <div class="d-inline-block ">
                              <h1 class="font_white">Dummy File Create</h1>
                              <p class="font_white">{{today | date: 'dd MMMM yyyy, hh:mm:ss a'}}</p>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
      <!-- Header title  -->
    
      <!-- body graph -->
    <div class="container-fluid i margin_bottom_53">


    <div class="container">
      <div class="row container_at_1665">
        <div class="container">  
            <div class="d-flex justify-content-between ">
                <div class="col-xl-3 col-lg-3 col-md-12  padding_right_12">
                  <div class="width_50_two_columns">
                    <div class="form-group padding_zero_6">
                      <label  class="col-form-label ellipsis form_label_text_width">Contract No</label>
                      <div class="form-group">
                          <input 
                            type="text" 
                            [(ngModel)]="searchText" 
                            class="form-control-plaintext  bg-light border rounded px-2 py-1" 
                            placeholder="Search Contract No"
                            (input)="onSearch()"
                          />
                    </div>
                  </div>
                </div>
              </div>
      </div>       
       
        <br>
        <!-- <div class="row common_border box_shadow padding_15 margin_bottom_10">
            <div class="col-xs-12 col-sm-2 col-md-2 col-lg-2">
              <label class="col-form-label"><b>Filter your Contract No</b></label>
            </div>
  
            <div class="col-xs-12 col-sm-10 col-md-10 col-lg-10">
              <input type="email" class="form-control-plaintext  bg-light border rounded px-2 py-1" (keyup)="applyFilter($event)" placeholder="Ex. Contract No" #input>
            </div>
          </div> -->
   
          <div class="row margin_bottom_15">
            <div class="example-container mat-elevation-z8">
              <mat-table #table [dataSource]="DataTable" multiTemplateDataRows matSort #sort="matSort">
  
                <ng-container matColumnDef="ContractNo">
                  <mat-header-cell *matHeaderCellDef mat-sort-header class="width_118 no_header_flx"> Contract No </mat-header-cell>
                  <mat-cell *matCellDef="let element" class="width_118 no_header_flx">
                    <button *ngIf="expandedElement != element">{{element.ContractNumber}}</button>
                  </mat-cell>
                </ng-container> 
                <ng-container matColumnDef="VehicleNo">
                  <mat-header-cell *matHeaderCellDef mat-sort-header> Vehicle No  </mat-header-cell>
                  <mat-cell *matCellDef="let element"> {{element.VehicleNo}} </mat-cell>
                </ng-container>
                <ng-container matColumnDef="HirerName">
                  <mat-header-cell *matHeaderCellDef mat-sort-header> Hirer Name  </mat-header-cell>
                  <mat-cell *matCellDef="let element"> {{element.Hirename}} </mat-cell>
                </ng-container>
                    
                <ng-container matColumnDef="expandedDetail">
                  <mat-cell *matCellDef="let detail"></mat-cell>
                </ng-container>
  
                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;" matRipple class="element-row"></mat-row>
  
              </mat-table>
              <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  
            </div>
  
          </div> 
      </div>
      <div class="col-xl-3 col-lg-3 col-md-6 margin_bottom_30 button-container">
        <button mat-raised-button color="accent" >Save</button>
        <button style="padding-left: 10px;" mat-raised-button color="accent" >Clear</button> 
      </div>    
      <br>
    </div>   
  </div>
  <br>

      <!-- body graph -->     
    </div>


</div>

    <app-footer class="footer_position"></app-footer>
