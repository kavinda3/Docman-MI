<div class="container-fluid margin_bottom_20">

  <!-- header bread crumbs -->
  <div class="container-fluid margin_bottom_20">
    <app-bread-crumbs></app-bread-crumbs>
  </div>
  <!-- header bread crumbs -->

  <!-- Header title  -->
  <div class="container-fluid margin_bottom_30">
    <div class="container-fluid fluid-bg-1 ishfaak-align-middle ">
      <div class="container">
        <div class="row container_at_1665">
          <div class="d-flex flex-row">
            <div class="d-inline-block">
              <div class="d-inline-block padding_right_30">
                <img src="/assets/images/admin.svg" class="side_nav_icon_extra_big fill_svg_white">
              </div>
            </div>
            <div class="d-inline-block ">
              <h1 class="font_white">Reports</h1>
              <p class="font_white">{{today | date: 'dd MMMM yyyy, hh:mm:ss a'}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Header title  -->

  <!-- body graph -->
  <div class="container-fluid i margin_bottom_53">

    <div class="container">
      <div class="row container_at_1665">
        <div class="container">
          <!-- set -->
          <div class="container p-3 bg-white rounded shadow-sm">
            <div class="container p-3 bg-white rounded shadow-sm">
              <div class="row g-3">
                <!-- Report Name -->
                <div class="col-xl-3 col-lg-4 col-md-6 padding_right_12">
                  <label class="col-form-label ellipsis form_label_text_width">Report Name</label>
                  <select class="form-select form-control-plaintext bg-light border rounded px-2 py-1"
                    style="font-size: 13px" [(ngModel)]="reportType">
                    <option *ngFor="let option of RptType" [value]="option.IRPTID">
                      {{ option.SZRPTNAME }}
                    </option>
                  </select>
                </div>

                <!-- From Date -->
                <div class="col-xl-3 col-lg-4 col-md-6 padding_right_12"
                  *ngIf="reportType?.substring(0,3) === 'D01' ||reportType?.substring(0,3) === 'T02'">
                  <label class="form-label">From Date</label>
                  <input type="date" class="form-control form-control-sm bg-light border rounded"
                    [(ngModel)]="fromdate">
                </div>

                <!-- Batch No (only for C01) -->
                <div class="col-xl-3 col-lg-4 col-md-6"
                  *ngIf="reportType?.substring(0,3) === 'C01' || reportType?.substring(0,3) === 'C02'">
                  <label class="form-label">Batch No</label>
                  <input type="text" class="form-control form-control-sm bg-light border rounded" [(ngModel)]="batchNo">
                </div>


                <!-- To Date -->
                <div class="col-xl-3 col-lg-4 col-md-6 padding_right_12"
                  *ngIf="reportType?.substring(0,3) === 'D01'||reportType?.substring(0,3) === 'T02'">
                  <label class="form-label">To Date</label>
                  <input type="date" class="form-control form-control-sm bg-light border rounded" [(ngModel)]="todate">
                </div>
                <!-- Contract No -->
                <div class="col-xl-3 col-lg-4 col-md-6" *ngIf="reportType?.substring(0,3) === 'T01'">
                  <label class="form-label">Contract No</label>
                  <input type="text" class="form-control-plaintext  bg-light border rounded px-2 py-1"
                    [(ngModel)]="contractNo">
                </div>

                <div class="col-xl-3 col-lg-4 col-md-6 padding_right_12"
                  *ngIf="reportType?.substring(0,3) === 'T03' || reportType?.substring(0,3) === 'T02'">
                  <label class="form-label">From location</label>
                  <select class="form-select form-control-plaintext  bg-light border rounded px-2 py-1"
                    style="font-size: 13px">
                    <option selected="selected"></option>
                    <option *ngFor="let option of Location" [(ngModel)]="fromLocation" value="{{option.strLocName}}">
                      {{option.strLocName}}</option>
                  </select>
                </div>
                <div class="col-xl-3 col-lg-4 col-md-6 padding_right_12" *ngIf="reportType?.substring(0,3) === 'D01'">
                  <label class="form-label">To location</label>
                  <select multiple style="font-size: 13px;" class="form-select form-select-sm bg-light border rounded"
                    [(ngModel)]="toLocation">
                    <option selected="selected"></option>
                    <option *ngFor="let option of Location" [(ngModel)]="toLocation" value="{{option.strLocName}}">
                      {{option.strLocName}}</option>
                  </select>
                </div>

                <!--To Location-->
                <div class="col-xl-3 col-lg-4 col-md-6 padding_right_12" *ngIf="reportType?.substring(0,3) === 'T03'">
                  <label class="form-label">To location</label>
                  <select style="font-size: 13px;" class="form-select form-select-sm bg-light border rounded"
                    [(ngModel)]="toLocation">
                    <option>2</option>
                    <option>N/R</option>
                    <option>INCOMPLETE</option>
                    <option>PENDING</option>
                    <option>BANK</option>
                  </select>
                </div>
                <!-- Date -->
                <div class="col-xl-3 col-lg-4 col-md-6 padding_right_12" *ngIf="reportType?.substring(0,3) === 'T03'">
                  <label class="form-label">Date</label>
                  <input type="date" class="form-control form-control-sm bg-light border rounded"
                    [(ngModel)]="fromdate">
                </div>
                <!--More than days-->
                <div class="col-xl-3 col-lg-4 col-md-6" *ngIf="reportType?.substring(0,3) === 'T03'">
                  <label class="form-label">More Than Days</label>
                  <input type="number" class="form-control-plaintext  bg-light border rounded px-2 py-1"
                    [(ngModel)]="contractNo">
                </div>
                <!-- Buttons -->
                <div class="col-12 d-flex justify-content-start gap-2 pt-2">
                  <button mat-raised-button color="accent" (click)="PrintReport()">Print</button>
                  <button mat-raised-button color="accent">Cancel</button>
                </div>
              </div>
            </div>

          </div>


          <br>
        </div>
      </div>
    </div>
    <!-- body graph -->
  </div>

  <!-- footer graph -->
  <app-footer class="footer_position"></app-footer>
  <!-- footer graph -->


  <app-right-menu></app-right-menu>
