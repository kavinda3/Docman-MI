<div class="container-fluid margin_bottom_20">

    <!-- header bread crumbs -->
    <div class="container-fluid margin_bottom_20">
        <app-bread-crumbs></app-bread-crumbs>
    </div>
    <!-- header bread crumbs --> 
      
      <!-- Header title  -->
      <div class="container-fluid margin_bottom_30">   
          <div class="container-fluid fluid-bg-1 ishfaak-align-middle ">   
              <div class="container">  
                  <div class="row container_at_1665">
                      <div class="d-flex flex-row">
                          <div class="d-inline-block">
                              <div class="d-inline-block padding_right_30">
                                  <img src="/assets/images/admin.svg" class="side_nav_icon_extra_big fill_svg_white">
                              </div>
                          </div>
                          <div class="d-inline-block ">
                              <h1 class="font_white">Pending Request {{lblHeader}}</h1>
                              <p class="font_white">{{today | date: 'dd MMMM yyyy, hh:mm:ss a'}}</p>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
      <!-- Header title  -->
    
      <!-- body graph -->
    <div class="container-fluid i margin_bottom_53">

    <div class="container">
      <div class="row container_at_1665">
        <div class="container">
        <!-- set -->          
        <div class="d-flex  flex-wrap">
            <div class="col-md-12 margin_bottom_30 padding_right_12">
              <div class="width_50_two_columns">
                <div class="form-group padding_zero_6">
                  <label  class="col-form-label ellipsis form_label_text_width"  *ngIf="selectedStatus === 'Approved' && onApprove()"><h2>Pending Request To Be Transfered</h2></label>
                  <label  class="col-form-label ellipsis form_label_text_width"  *ngIf="selectedStatus === 'Not Approved' && onNotApprove()"><h2>Pending Request To Be Approved</h2></label>
                </div>
              </div>
            </div>     
          </div>
          <div class="row">
            <div class="col-md-12 d-flex align-items-center">
              <div class="form-check me-3">
                <input 
                  class="form-check-input" 
                  type="radio" 
                  name="myRadioGroup" 
                  [value]="'Approved'" 
                  [(ngModel)]="selectedStatus"
                  id="approvedRadio"
                  (change)="onRadioChange(1)">
                  
                <label class="form-check-label" for="approvedRadio">
                  Approved by BSD
                </label>
              </div>
          
              <div class="form-check me-3">
                <input 
                  class="form-check-input" 
                  type="radio" 
                  name="myRadioGroup" 
                  [value]="'Not Approved'" 
                  [(ngModel)]="selectedStatus"
                  id="notApprovedRadio"
                  (change)="onRadioChange(0)">
                <label class="form-check-label" for="rejectedRadio">
                  Not Approved by BSD
                </label>
              </div>
            </div>
          </div>

        <!-- <div class="col-xl-6 col-lg-6 col-md-12 margin_bottom_30 padding_right_12">
          <button mat-raised-button color="accent" (click)="SaveProduct()">{{btnName}}</button>
          <button mat-raised-button color="accent" (click)="Clear()">Clear</button> 
        </div> -->
                          
        <br>

        <div class="row common_border box_shadow padding_15 margin_bottom_10">
          <div class="col-xs-12 col-sm-2 col-md-2 col-lg-2">
            <label class="col-form-label"><b>Filter your menu</b></label>
          </div>

          <div class="col-xs-12 col-sm-10 col-md-10 col-lg-10">
            <input type="email" class="form-control-plaintext  bg-light border rounded px-2 py-1" (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
          </div>
        </div>

        <div class="row margin_bottom_15">
          <div class="example-container mat-elevation-z8">
            <mat-table #table [dataSource]="dataSource" multiTemplateDataRows matSort #sort="matSort">

              <ng-container matColumnDef="RequestNo">
                <mat-header-cell *matHeaderCellDef mat-sort-header class="width_118 no_header_flx"> Request No </mat-header-cell>
                <mat-cell *matCellDef="let element" class="width_118 no_header_flx">
                  <button *ngIf="expandedElement != element">{{element.ReqNo}}</button>
                </mat-cell>
              </ng-container> 
              <ng-container matColumnDef="Location">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Location  </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.LocName}} </mat-cell>
              </ng-container>
              <ng-container matColumnDef="Requestuser">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Request user  </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.ReqUser}} </mat-cell>
              </ng-container>
              <ng-container matColumnDef="RequestDate">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Request Date  </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.ReqDate}} </mat-cell>
              </ng-container>
              <ng-container matColumnDef="Approve">
                <mat-header-cell *matHeaderCellDef> Approve </mat-header-cell>
                <mat-cell *matCellDef="let element">
                  <mat-checkbox [(ngModel)]="element.approve">
                    {{ element.approve ? 'Yes' : 'No' }}
                  </mat-checkbox>
                </mat-cell>
              </ng-container>        
              <ng-container matColumnDef="expandedDetail">
                <mat-cell *matCellDef="let detail"></mat-cell>
              </ng-container>

              <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
             
              <mat-row *matRowDef="let row; columns: displayedColumns;" matRipple class="element-row"
                [class.selected-row]="row.strReqNo === selectedTrnNo" (click)="onRowClicked(row)">
              </mat-row>
            </mat-table>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
              
          </div>

        </div>
        <div class="col-xl-3 col-lg-3 col-md-6 margin_bottom_30 button-container">
          <button *ngIf="isTSRButtonVisible" mat-raised-button color="accent" >Transfer Selected Request</button>
          <button *ngIf="isApprove" style="padding-left: 10px;" mat-raised-button color="accent" >Approve</button> 
          <button  style="padding-left: 10px;" mat-raised-button color="accent" >Close</button> 
        </div>
      </div>
    </div>
  </div>
      <!-- body graph -->     
</div>
    
    <!-- footer graph -->
    <app-footer class="footer_position"></app-footer>
    <!-- footer graph -->
    
    
    <app-right-menu></app-right-menu>
