<div class="container-fluid margin_bottom_20">

    <!-- header bread crumbs -->
    <div class="container-fluid margin_bottom_20">
        <app-bread-crumbs></app-bread-crumbs>
    </div>
    <!-- header bread crumbs --> 
      
      <!-- Header title  -->
      <div class="container-fluid margin_bottom_30">   
          <div class="container-fluid fluid-bg-1 ishfaak-align-middle ">   
              <div class="container">  
                  <div class="row container_at_1665">
                      <div class="d-flex flex-row">
                          <div class="d-inline-block">
                              <div class="d-inline-block padding_right_30">
                                  <img src="/assets/images/admin.svg" class="side_nav_icon_extra_big fill_svg_white">
                              </div>
                          </div>
                          <div class="d-inline-block ">
                              <h1 class="font_white">Document Display Order</h1>
                              <p class="font_white">{{today | date: 'dd MMMM yyyy, hh:mm:ss a'}}</p>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
      <!-- Header title  -->
    
      <!-- body graph -->
    <div class="container-fluid i margin_bottom_53">
    
    <div class="container">
      <div class="row container_at_1665">
        <div class="container">
        <!-- set -->          
        <div class="d-flex justify-content-between flex-wrap">
          <div class="col-xl-3 col-lg-3 col-md-12 margin_bottom_30 padding_right_12">
            <div class="width_50_two_columns">
              <div class="form-group padding_zero_6">
                <label  class="col-form-label ellipsis form_label_text_width">Contract Type</label>
                <select class="form-select form-control-plaintext  bg-light border rounded px-2 py-1 readonly" [(ngModel)]="docType" (change)="onLoadTable()"> 
                    <option *ngFor="let option of DocTypes" value="{{option.DocType}}" >{{option.DocType}}</option>
                  </select>
              </div>
            </div>
          </div>
          <div class="col-xl-3 col-lg-3 col-md-12 padding_right_12 " style="margin-top: 28px;">
            <div class="width_50_two_columns">
              <div class="form-group padding_zero_6">
                <button mat-raised-button color="accent" >Order</button>
              </div>
            </div>
          </div>
         
          <div class="col-xl-3 col-lg-3 col-md-12 margin_bottom_30 padding_right_12"></div>
                  
        </div>
        <div class="row margin_bottom_15">
          <div class="example-container mat-elevation-z8">
            <mat-table #table [dataSource]="dataSourceTable" multiTemplateDataRows matSort #sort="matSort">

              <ng-container matColumnDef="Doc_Code">
                <mat-header-cell *matHeaderCellDef mat-sort-header class="width_118 no_header_flx"> Doc Code </mat-header-cell>
                <mat-cell *matCellDef="let element" class="width_118 no_header_flx">
                  <button *ngIf="expandedElement != element">{{element.DocCode}}</button>
                </mat-cell>
              </ng-container> 

              <ng-container matColumnDef="Doc_Name">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Doc Name </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.DocName}} </mat-cell>
              </ng-container>

              <ng-container matColumnDef="Doc_Type">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Doc Type </mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.DocType}}</mat-cell>
              </ng-container>
              <ng-container matColumnDef="Doc_Seq">
                <mat-header-cell *matHeaderCellDef mat-sort-header> Seq </mat-header-cell>
                <mat-cell *matCellDef="let element">{{element.DocSeq}}</mat-cell>
              </ng-container>
              <ng-container matColumnDef="DTAdd">
                <mat-header-cell *matHeaderCellDef> Status Remark </mat-header-cell>
                <mat-cell *matCellDef="let element">
                  <mat-form-field floatLabel="never" class="input-width">
                    <input matInput  class="custom_inputtext" placeholder="Type" [value]="element.RemarkofFile" [(ngModel)]="element.RemarkofFile">
                  </mat-form-field>
                </mat-cell>
              </ng-container>

              <ng-container matColumnDef="expandedDetail">
                <mat-cell *matCellDef="let detail"></mat-cell>
              </ng-container>

              <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
              <mat-row *matRowDef="let row; columns: displayedColumns;" matRipple class="element-row"></mat-row>

            </mat-table>
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

          </div>
        
        </div>

        <div class="col-xl-6 col-lg-6 col-md-12 margin_bottom_30 padding_right_12">
            <button mat-raised-button color="accent" (click)="SaveProduct()">{{btnName}}</button>
          </div>
      </div>
    </div>
  </div>
      <!-- body graph -->     
</div>
    
    <!-- footer graph -->
    <app-footer class="footer_position"></app-footer>
    <!-- footer graph -->
    
    
    <app-right-menu></app-right-menu>
